<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-[380px] bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
    
    <!-- Cabecera -->
    <div class="mb-8 text-center">
      <h2 class="text-2xl font-semibold tracking-tight text-slate-800">
        Bienvenido
      </h2>
      <p class="text-sm text-slate-500 mt-2">
        Ingresa tus credenciales para acceder
      </p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="login()" class="space-y-5">
      
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-slate-700">Usuario</label>
        <input
          type="text"
          placeholder="Ej. admin"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          required
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 transition-all duration-200"
        />
      </div>

      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-slate-700">Contraseña</label>
        <input
          type="password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 transition-all duration-200"
        />
      </div>

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 disabled:bg-slate-200 disabled:text-slate-500 cursor-pointer disabled:cursor-not-allowed shadow-sm"
      >
        {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <!-- Alerta de Error -->
    @if (mensaje()) {
      <div class="mt-6 text-sm text-center font-medium text-red-600 bg-red-50 py-2.5 px-4 rounded-lg border border-red-100">
        {{ mensaje() }}
      </div>
    }

  </div>
</div>
